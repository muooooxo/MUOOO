<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUOOO | 專業代購自助系統</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;900&display=swap');

        :root {
            --m-honey: #f9d342;
            --m-brown: #7b4a34;
            --m-cream: #fefcf3;
            --m-soft-y: #fff9e6;
            --m-white: #ffffff;
            --m-accent: #fce38a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 全域平滑捲動 */
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--m-cream);
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--m-brown);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 頂級複合式背景 --- */
        .master-bg {
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(var(--m-accent) 1.5px, transparent 1.5px),
                        linear-gradient(180deg, var(--m-cream) 0%, var(--m-soft-y) 100%);
            background-size: 40px 40px, 100% 100%;
            opacity: 0.9;
        }

        /* --- 🐝 新增：頂部固定導覽列 --- */
        header {
            position: sticky;
            top: 0;
            background: rgba(254, 252, 243, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--m-honey);
            z-index: 1000;
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            color: var(--m-brown);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--m-brown);
            font-weight: 900;
            font-size: 0.95rem;
            padding: 6px 14px;
            border-radius: 50px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            background: var(--m-honey);
        }

        /* --- Hero 迎接區 --- */
        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .title-group {
            position: relative;
            margin-bottom: 25px;
        }

        .title-group h1 {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(3.5rem, 18vw, 9.5rem);
            color: var(--m-white);
            -webkit-text-stroke: 2px var(--m-brown);
            text-shadow: 6px 6px 0 var(--m-honey), 12px 12px 0 var(--m-brown);
            letter-spacing: -2px;
            animation: title-sway 4s ease-in-out infinite;
            line-height: 1.1;
        }

        @keyframes title-sway {
            0%, 100% { transform: rotate(-1deg) scale(1); }
            50% { transform: rotate(1deg) scale(1.02); }
        }

        .title-tag {
            background: var(--m-brown);
            color: var(--m-honey);
            padding: 5px 22px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            display: inline-block;
            transform: rotate(-3deg);
            box-shadow: 4px 4px 0 var(--m-honey);
            letter-spacing: 1px;
            margin-top: -5px;
        }

        .entrance-wrap {
            margin-top: 45px;
            display: flex;
            justify-content: center;
        }

        .btn-base {
            padding: 16px 50px;
            border-radius: 100px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-main {
            background: var(--m-brown);
            color: #fff;
            box-shadow: 0 8px 0 var(--m-honey), 0 15px 30px rgba(123,74,52,0.2);
        }
        .btn-main:hover { transform: translateY(4px); box-shadow: 0 4px 0 var(--m-honey); }

        /* --- 功能區塊 --- */
        .system-wrap {
            padding: 60px 20px 100px;
            display: flex;
            justify-content: center;
        }

        .main-frame {
            max-width: 1100px;
            width: 100%;
            background: var(--m-white);
            padding: 80px 40px;
            border-radius: 60px;
            position: relative;
            box-shadow: 0 0 0 12px var(--m-white), 0 0 0 20px var(--m-soft-y), 25px 30px 0 var(--m-brown);
        }

        .func-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            justify-items: center;
        }

        .func-item {
            text-align: center;
            text-decoration: none;
            color: inherit;
            width: 100%;
            transition: 0.3s;
            perspective: 1000px;
        }

        .icon-box {
            width: 120px;
            height: 120px;
            background: var(--m-cream);
            margin: 0 auto 20px;
            border-radius: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 10px 10px 0 var(--m-soft-y);
        }

        .func-item:hover .icon-box {
            transform: translateY(-15px) rotateY(10deg);
            background: var(--m-honey);
            box-shadow: 15px 20px 0 var(--m-brown);
        }

        .func-item h3 { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; white-space: nowrap; }

        /* --- 聯繫客服區塊 --- */
        .contact-container {
            position: relative;
            background: linear-gradient(180deg, #ffd15c 0%, #ffc124 100%);
            padding: 120px 20px 80px;
            text-align: center;
            overflow: hidden;
        }

        .contact-container::before {
            content: "";
            position: absolute;
            top: -1px; left: -10%;
            width: 120%; height: 80px;
            background-color: var(--m-cream);
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            z-index: 1;
        }

        .contact-content { position: relative; z-index: 5; }

        .bee-decor {
            font-size: 4.5rem;
            display: inline-block;
            margin-bottom: 15px;
            animation: fancy-float 4s ease-in-out infinite;
        }

        @keyframes fancy-float {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-20px) rotate(8deg); }
        }

        .btn-line-cute {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--m-white);
            color: var(--m-brown);
            padding: 16px 45px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.3rem;
            border: 3px solid var(--m-brown);
            box-shadow: 0 8px 0 var(--m-brown);
            transition: all 0.3s;
        }

        .btn-line-cute:hover {
            transform: scale(1.05);
            background: var(--m-cream);
            box-shadow: 0 4px 0 var(--m-brown);
        }

        footer { margin-top: 80px; font-weight: 900; opacity: 0.3; letter-spacing: 5px; font-size: 0.8rem; }

        /* --- 📱 手機版排版修正 --- */
        @media (max-width: 768px) {
            .nav-links { gap: 6px; }
            .nav-links a { font-size: 0.85rem; padding: 4px 8px; }
            .hero { padding: 40px 20px 20px; min-height: 70vh; }
            .title-group h1 { font-size: 4rem; -webkit-text-stroke: 1.5px var(--m-brown); text-shadow: 4px 4px 0 var(--m-honey), 8px 8px 0 var(--m-brown); }
            .title-tag { font-size: 0.85rem; padding: 4px 16px; margin-top: 5px; }
            
            .system-wrap { padding: 40px 15px 60px; }
            .func-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .main-frame { padding: 40px 15px; border-radius: 40px; box-shadow: 0 0 0 8px var(--m-white), 0 0 0 15px var(--m-soft-y), 15px 15px 0 var(--m-brown); }
            .icon-box { width: 90px; height: 90px; font-size: 3rem; border-radius: 30px; margin-bottom: 12px; }
            .func-item h3 { font-size: 1.1rem; }
            
            .contact-container::before { height: 50px; }
            .btn-line-cute { padding: 14px 35px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="master-bg"></div>

                <li><a href="#contact">聯繫客服</a></li>

    <section class="hero">

                <a href="#order-section" class="func-item">

    <!-- 聯繫客服區塊 -->

        <div class="contact-content">

            <p style="margin-bottom: 35px; font-weight: 900; opacity: 0.7; font-size: 1.1rem;">馬上聯繫小蜜蜂！</p>
            
            <a href="https://line.me/R/ti/p/@Muooo" target="_blank" class="btn-line-cute">

            </a>

            <footer>

    </section>

</body>
</html>
